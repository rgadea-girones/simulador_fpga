<svg  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:s="https://github.com/nturley/netlistsvg"
  width="800" height="300">
  <s:properties>
    <s:layoutEngine
      org.eclipse.elk.layered.spacing.nodeNodeBetweenLayers="35"
      org.eclipse.elk.spacing.nodeNode= "35"
      org.eclipse.elk.layered.layering.strategy= "LONGEST_PATH"
    />
    <s:low_priority_alias val="$dff" />
  </s:properties>
<style>
svg { stroke:#000; fill:none; }
text { fill:#000; stroke:none; font-size:10px; font-weight: bold; font-family: "Courier New", monospace; }
.nodelabel { text-anchor: middle; }
.inputPortLabel { text-anchor: end; }
.splitjoinBody { fill:#000; }
line[class*=","] { stroke-width: 3; }
</style>
  <g s:type="mux" transform="translate(50, 50)" s:width="20" s:height="40">
    <s:alias val="$pmux"/>
    <s:alias val="$mux"/>
    <s:alias val="$_MUX_"/>
    <path d="M0,0 L20,10 L20,30 L0,40 Z" class="$cell_id" fill="#4A90D9"/>
    <g s:x="0" s:y="10" s:pid="A"/>
    <g s:x="0" s:y="30" s:pid="B"/>
    <g s:x="10" s:y="35" s:pid="S"/>
    <g s:x="20" s:y="20" s:pid="Y"/>
  </g>
  <g s:type="and" transform="translate(150,50)" s:width="30" s:height="25">
    <s:alias val="$and"/>
    <s:alias val="$logic_and"/>
    <s:alias val="$_AND_"/>
    <path d="M0,0 L0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="$cell_id" fill="#4A90D9"/>
    <g s:x="0" s:y="5" s:pid="A"/>
    <g s:x="0" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="or" transform="translate(250,50)" s:width="30" s:height="25">
    <s:alias val="$or"/>
    <s:alias val="$logic_or"/>
    <s:alias val="$_OR_"/>
    <path d="M0,0 A30 25 0 0 1 0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="$cell_id" fill="#4A90D9"/>
    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="reduce_xor" transform="translate(350, 50)" s:width="33" s:height="25">
    <s:alias val="$xor"/>
    <s:alias val="$reduce_xor"/>
    <s:alias val="$_XOR_"/>
    <path d="M3,0 A30 25 0 0 1 3,25 A30 25 0 0 0 33,12.5 A30 25 0 0 0 3,0" class="$cell_id" fill="#4A90D9"/>
    <path d="M0,0 A30 25 0 0 1 0,25" class="$cell_id"/>
    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="33" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="not" transform="translate(450,100)" s:width="30" s:height="20">
    <s:alias val="$_NOT_"/>
    <s:alias val="$not"/>
    <s:alias val="$logic_not"/>
    <path d="M0,0 L0,20 L20,10 Z" class="$cell_id" fill="#4A90D9"/>
    <circle cx="23" cy="10" r="3" class="$cell_id" fill="white"/>
    <g s:x="0" s:y="10" s:pid="A"/>
    <g s:x="25" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="inputExt" transform="translate(50,250)" s:width="30" s:height="20">
    <text x="15" y="-4" class="nodelabel $cell_id" s:attribute="ref">input</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="$cell_id"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="outputExt" transform="translate(250,250)" s:width="30" s:height="20">
    <text x="15" y="-4" class="nodelabel $cell_id" s:attribute="ref">output</text>
    <s:alias val="$_outputExt_"/>
    <path d="M30,0 L30,20 L15,20 L0,10 L15,0 Z" class="$cell_id"/>
    <g s:x="0" s:y="10" s:pid="A"/>
  </g>
  <g s:type="$adff" s:width="40" s:height="57">
    <s:alias val="$adff"/>
    <s:alias val="$adffe"/>
    <s:alias val="$dffe"/>
    <s:alias val="$dff"/>
    <s:alias val="$_DFF_P_"/>
    <s:alias val="$_DFF_N_"/>
    <s:alias val="$_DFF_PN0_"/>
    <s:alias val="$_DFF_PP0_"/>
    <s:alias val="$_DFFE_PN0P_"/>
    <s:alias val="$_DFFE_PP0P_"/>
    <s:alias val="$_DFFE_PN0N_"/>
    <s:alias val="$_DFFE_PP0N_"/>
    <rect class="netlistsvg_cell" x="0" y="0" width="40" height="50" rx="2" ry="2" fill="#81C784"/>
    <circle cx="20" cy="53" r="2.5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <path d="M 0 22 L 6 26 L 0 30" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text class="netlistsvg_text" x="20" y="8" text-anchor="middle" font-size="6px" font-weight="bold">DFF</text>
    <text class="netlistsvg_text" x="5" y="15" font-size="6px">D</text>
    <text class="netlistsvg_text" x="8" y="28" font-size="6px">CLK</text>
    <text class="netlistsvg_text" x="5" y="38" font-size="6px">EN</text>
    <text class="netlistsvg_text" x="20" y="46" text-anchor="middle" font-size="5px">ARST</text>
    <text class="netlistsvg_text" x="34" y="15" text-anchor="end" font-size="6px">Q</text>
    <g s:x="0"  s:y="12" s:pid="D"/>
    <g s:x="0"  s:y="26" s:pid="CLK"/>
    <g s:x="0"  s:y="26" s:pid="C"/>
    <g s:x="0"  s:y="38" s:pid="EN"/>
    <g s:x="0"  s:y="38" s:pid="E"/>
    <g s:x="20" s:y="57" s:pid="ARST"/>
    <g s:x="20" s:y="57" s:pid="CLR"/>
    <g s:x="20" s:y="57" s:pid="R"/>
    <g s:x="40" s:y="12" s:pid="Q"/>
  </g>
</svg>
