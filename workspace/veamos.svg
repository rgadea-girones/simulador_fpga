<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="http://www.github.com/nturley/netlistsvg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     s:width="1" s:height="1">

  <!-- Configuración de estilos y motor de trazado (ELK) -->
  <s:properties layoutEngine="elk" strokeWidth="2" strokeColor="#000000"/>

  <style>
    .netlistsvg_net { stroke: #000000; stroke-width: 2; fill: none; }
    .netlistsvg_cell { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .netlistsvg_text { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #000000; }
  </style>

 <svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="http://www.github.com/nturley/netlistsvg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     s:width="1" s:height="1">

  <s:properties layoutEngine="elk" strokeWidth="2" strokeColor="#000000"/>

  <style>
    /* ================================================================ */
    /* CABLES, TEXTO Y PUERTOS DE ENTRADA/SALIDA                        */
    /* ================================================================ */
    .netlistsvg_net, path.netlistsvg_net { stroke: #000000; stroke-width: 2px; fill: none; }
    
    /* Cajas genéricas / Flip-Flops (VERDE) */
    .netlistsvg_cell, rect { fill: #2e7d32; stroke: #1b5e20; stroke-width: 2px; }
    
    /* Puertas lógicas y Multiplexores (ROJO / ROJIZO) */
    .gate_cell path, .gate_cell rect { fill: #c62828 !important; stroke: #8e0000 !important; stroke-width: 2px; }
    
    /* Textos generales */
    text, .netlistsvg_text { font-family: 'Consolas', 'Courier New', monospace; font-size: 10px; fill: #ffffff !important; font-weight: bold; }
  </style>

  <defs>
    <!-- PUERTOS DE ENTRADA Y SALIDA (FONDO BLANCO, BORDES NEGROS) -->
    <g s:type="inputExt" s:width="30" s:height="20">
      <path d="M 0,0 L 20,0 L 30,10 L 20,20 L 0,20 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g s:x="30" s:y="10" s:pid="out"/>
    </g>

    <g s:type="outputExt" s:width="30" s:height="20">
      <path d="M 0,0 L 20,0 L 30,10 L 20,20 L 0,20 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g s:x="0" s:y="10" s:pid="in"/>
    </g>

    <g s:type="constant" s:width="30" s:height="20">
      <circle cx="15" cy="10" r="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g s:x="15" s:y="10" s:pid="out"/>
    </g>

    <!-- PUERTAS LÓGICAS COMBINACIONALES (ROJIZO) -->
    <!-- NOT -->
    <g s:type="$not" class="gate_cell" s:width="30" s:height="20">
      <path d="M 0,0 L 20,10 L 0,20 Z" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
      <circle cx="23" cy="10" r="3" fill="#ffffff" stroke="#8e0000" stroke-width="2"/>
      <g s:x="0" s:y="10" s:pid="A"/>
      <g s:x="26" s:y="10" s:pid="Y"/>
    </g>

    <!-- AND -->
    <g s:type="$and" class="gate_cell" s:width="30" s:height="20">
      <path d="M 0,0 L 15,0 A 10,10 0 0,1 15,20 L 0,20 Z" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
      <g s:x="0" s:y="5" s:pid="A"/>
      <g s:x="0" s:y="15" s:pid="B"/>
      <g s:x="25" s:y="10" s:pid="Y"/>
    </g>

    <!-- OR -->
    <g s:type="$or" class="gate_cell" s:width="30" s:height="20">
      <path d="M 0,0 Q 10,10 0,20 Q 20,20 30,10 Q 20,0 0,0 Z" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
      <g s:x="3" s:y="5" s:pid="A"/>
      <g s:x="3" s:y="15" s:pid="B"/>
      <g s:x="30" s:y="10" s:pid="Y"/>
    </g>

    <!-- MUX -->
    <g s:type="$mux" class="gate_cell" s:width="20" s:height="40">
      <path d="M 0,0 L 20,5 L 20,35 L 0,40 Z" fill="#c62828" stroke="#8e0000" stroke-width="2"/>
      <g s:x="0" s:y="10" s:pid="A"/>
      <g s:x="0" s:y="30" s:pid="B"/>
      <g s:x="10" s:y="37" s:pid="S"/>
      <g s:x="20" s:y="20" s:pid="Y"/>
    </g>
  </defs>
</svg>




